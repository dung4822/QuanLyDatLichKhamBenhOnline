# Toàn bộ hệ thống trên một máy: PostgreSQL + API + Caddy (frontend + HTTPS + chuyển /api sang API).
# Chạy trong thư mục deploy/:  docker compose up -d --build
# Hướng dẫn đầy đủ: docs/deploy/ORACLE_CLOUD.md
name: medicare

x-connection: &connection "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Không mở cổng DB ra Internet. Xem dữ liệu: docker compose exec db psql -U <user> -d <db>

  # Áp dụng migration mới mỗi lần `docker compose up`, xong thì tự thoát.
  migrate:
    build:
      context: ..
      target: migrations
    environment:
      ConnectionStrings__DefaultConnection: *connection
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Tin header X-Forwarded-Proto/For từ Caddy: API biết request là HTTPS (cookie __Host- và CSRF cần điều này)
      # và rate limit theo IP thật của người dùng thay vì IP của Caddy.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: *connection
      DataProtection__KeysPath: /keys
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - dpkeys:/keys
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ${FRONTEND_DIR:-../../frontend}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:
